<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="/assets/img/bouquet-svgrepo-com.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../assets/css/global.css" rel="stylesheet">
  <link href="produtos.css" rel="stylesheet">
  <title>Produtos — La Flora Boutique</title>
</head>

<body>
  <header class="topo">
    <div class="container-xl d-flex align-items-center py-3 gap-4">
      <a href="../catalogo/catalogo.html" class="marca"><i class="bi bi-flower1"></i> La Flora Boutique</a>
      <nav class="nav-topo d-none d-md-block">
        <a href="../catalogo/catalogo.html">Catálogo</a>
        <a href="produtos.html" class="ativo">Produtos</a>
        <a href="../usuarios/usuarios.html">Usuários</a>
      </nav>
      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="../carrinho/carrinho.html" class="btn-icone" aria-label="Carrinho">
          <i class="bi bi-bag fs-5"></i><span class="badge-carrinho" id="badge-carrinho">0</span>
        </a>
        <button class="btn-icone" id="btn-sair" title="Sair"><i class="bi bi-box-arrow-right fs-5"></i></button>
      </div>
    </div>
  </header>

  <main class="container-xl py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <span class="eyebrow text-verde"><i class="bi bi-flower2"></i> Administração</span>
        <h1 class="serif fs-1 mb-0">Gerenciamento de Produtos</h1>
      </div>
      <button class="btn btn-verde" id="btn-novo-produto">
        <i class="bi bi-plus-lg"></i> Novo Produto
      </button>
    </div>

    <div class="painel">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Categoria</th>
              <th>Evento / Sentimento</th>
              <th>Preço</th>
              <th>Status</th>
              <th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-produtos"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal fade" id="modal-produto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <form class="modal-content" id="form-produto">
        <div class="modal-header">
          <h2 class="modal-title serif fs-3" id="titulo-modal-produto">Novo Produto</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-md-4">
            <label class="form-label" for="prod-id">ID (slug)</label>
            <input class="form-control" id="prod-id" maxlength="40" required placeholder="ex: buque-10">
          </div>
          <div class="col-md-8">
            <label class="form-label" for="prod-nome">Nome</label>
            <input class="form-control" id="prod-nome" maxlength="120" required>
          </div>
          <div class="col-12">
            <label class="form-label" for="prod-descricao">Descrição</label>
            <input class="form-control" id="prod-descricao" maxlength="255" required>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="prod-preco">Preço (R$)</label>
            <input class="form-control" type="number" step="0.01" min="0" id="prod-preco" required>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="prod-categoria">Categoria</label>
            <select class="form-select" id="prod-categoria" required>
              <option value="mix">Mix de cores</option>
              <option value="individuais">Cores individuais</option>
              <option value="acessorio">Acessório</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="prod-img">Arquivo de imagem</label>
            <input class="form-control" id="prod-img" maxlength="255" placeholder="arquivo.png (em assets/img)">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="prod-evento">Evento (chatbot)</label>
            <select class="form-select" id="prod-evento">
              <option value="">Nenhum</option>
              <option value="jantar">Jantar</option>
              <option value="especial">Especial</option>
              <option value="presente">Presente</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="prod-sentimento">Sentimento (chatbot)</label>
            <select class="form-select" id="prod-sentimento">
              <option value="">Nenhum</option>
              <option value="felicidade">Felicidade</option>
              <option value="carinho">Carinho</option>
              <option value="acolhimento">Acolhimento</option>
            </select>
          </div>
          <div class="col-12">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="prod-ativo" checked>
              <label class="form-check-label" for="prod-ativo">Produto ativo</label>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-verde">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/alertas.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/carrinho-store.js"></script>
  <script src="../../assets/js/produtos.js"></script>
  <script src="../../assets/js/admin-produtos.js"></script>
</body>

</html>
