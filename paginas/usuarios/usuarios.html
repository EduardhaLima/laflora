<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="/assets/img/bouquet-svgrepo-com.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../assets/css/global.css?v=avisos-1" rel="stylesheet">
  <link href="usuarios.css" rel="stylesheet">
  <title>Usuários — La Flora Boutique</title>
</head>

<body>
  <header class="topo">
    <div class="container-xl d-flex flex-wrap align-items-center py-3 gap-4">
      <a href="../catalogo/catalogo.html" class="marca"><i class="bi bi-flower1"></i> La Flora Boutique</a>
      <nav class="nav-topo" aria-label="Navegação principal">
        <a href="../catalogo/catalogo.html">Catálogo</a>
        <a href="../produtos/produtos.html">Produtos</a>
        <a href="usuarios.html" class="ativo">Usuários</a>
      </nav>
      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="../carrinho/carrinho.html" class="btn-icone" aria-label="Carrinho">
          <i class="bi bi-bag fs-5"></i><span class="badge-carrinho" id="badge-carrinho">0</span>
        </a>
        <details class="menu-conta" hidden>
          <summary class="btn-icone cheio" aria-label="Minha conta">
            <i class="bi bi-person-fill" aria-hidden="true"></i>
          </summary>
          <ul class="menu-conta-opcoes">
            <li><button type="button" data-modal-conta="perfil" aria-haspopup="dialog">Editar perfil</button></li>
            <li><button type="button" data-modal-conta="configuracoes" aria-haspopup="dialog">Configurações da conta</button></li>
          </ul>
        </details>
        <button class="btn-icone" id="btn-sair" title="Sair"><i class="bi bi-box-arrow-right fs-5"></i></button>
      </div>
    </div>
  </header>

  <main class="container-xl py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <span class="eyebrow text-verde"><i class="bi bi-shield-lock"></i> Administração</span>
        <h1 class="serif fs-1 mb-0">Gerenciamento de Usuários</h1>
      </div>
      <div class="busca-wrap">
        <i class="bi bi-search"></i>
        <input id="busca-usuarios" class="busca" type="search" aria-label="Buscar usuários por nome, e-mail ou ID" placeholder="Buscar por nome, e-mail ou ID">
      </div>
    </div>

    <div class="painel">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Telefone</th>
              <th>Papel</th>
              <th>Status</th>
              <th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-usuarios"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal fade" id="modal-usuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="form-usuario">
        <div class="modal-header">
          <h2 class="modal-title serif fs-3">Editar Usuário</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body row g-3">
          <input type="hidden" id="usr-id">
          <div class="col-12">
            <label class="form-label" for="usr-nome">Nome completo</label>
            <input class="form-control" id="usr-nome" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="usr-email">E-mail</label>
            <input class="form-control" type="email" id="usr-email" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="usr-telefone">Telefone (11 dígitos)</label>
            <input class="form-control" id="usr-telefone" maxlength="11" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="usr-nascimento">Nascimento</label>
            <input class="form-control" type="date" id="usr-nascimento" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="usr-papel">Papel</label>
            <select class="form-select" id="usr-papel">
              <option value="cliente">Cliente</option>
              <option value="admin">Administrador</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label" for="usr-senha">Nova senha (opcional)</label>
            <input class="form-control" type="password" id="usr-senha" minlength="8" placeholder="Deixe em branco para manter">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-verde">Salvar alterações</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/alertas.js?v=avisos-1"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/carrinho-store.js"></script>
  <script src="../../assets/js/produtos.js"></script>
  <script src="../../assets/js/usuarios.js?v=avisos-1"></script>
  <script src="../../assets/js/perfil.js?v=menu-cliente-1"></script>
</body>

</html>
